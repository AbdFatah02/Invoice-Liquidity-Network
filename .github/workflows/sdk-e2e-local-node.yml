name: SDK E2E (local Stellar node)

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'packages/shared/**'
      - 'packages/sdk/**'
      - 'backend/**'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Least-privilege: read code to run the local-node E2E suite.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pnpm-cache:
    uses: ./.github/workflows/reusable-cache-pnpm.yml

  e2e-local:
    needs: pnpm-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '18'

      - name: Start local Stellar node via Docker Compose
        run: |
          docker compose -f tests/e2e/docker-compose.yml up -d

      - name: Wait for Horizon
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:8000/ >/dev/null; then
              echo "Horizon is up"; exit 0;
            fi
            sleep 2
          done
          echo "Horizon did not start"; exit 1

      - name: Run SDK e2e tests
        run: pnpm --filter @iln/sdk test:e2e-local

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down
