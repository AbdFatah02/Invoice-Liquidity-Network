name: CI

on:
  push:
    branches: ['main']
  pull_request:

# Least-privilege: read code and comment CI status on pull requests.
permissions:
  contents: read
  pull-requests: write

# Fail fast: cancel an in-progress run when new commits are pushed to the same
# ref (e.g. a PR branch), so only the latest commit consumes CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      shared_config: ${{ steps.filter.outputs.shared_config }}
      notifications: ${{ steps.filter.outputs.notifications }}
      sdk: ${{ steps.filter.outputs.sdk }}
      cli: ${{ steps.filter.outputs.cli }}
      indexer: ${{ steps.filter.outputs.indexer }}
      oracle: ${{ steps.filter.outputs.oracle }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.gitmodules'
            shared_config:
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'pnpm-lock.yaml'
              - 'vitest.config.ts'
              - '.nvmrc'
            notifications:
              - 'notifications/**'
            sdk:
              - 'sdk/**'
              - 'packages/sdk/**'
              - 'packages/shared/**'
              - 'tests/sdk-integration/**'
            cli:
              - 'cli/**'
            indexer:
              - 'indexer/**'
              - 'packages/indexer/**'
            oracle:
              - 'oracle-service/**'
            packages:
              - 'packages/**'

  pnpm-cache:
    uses: ./.github/workflows/reusable-cache-pnpm.yml

  testnet-health:
    uses: ./.github/workflows/reusable-testnet-health.yml

  test:
    name: Run tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run cargo test
        working-directory: ./backend
        run: |
          START=$(date +%s)
          cargo test --target x86_64-unknown-linux-gnu
          END=$(date +%s)
          DURATION=$((END - START))
          BUDGET=$(jq -r '.budgets[] | select(.package=="backend") | .budgetSeconds' ../test-runtime-budgets.json)
          echo "backend test runtime: ${DURATION}s (budget: ${BUDGET}s)"
          if [ "$DURATION" -gt "$BUDGET" ]; then
            echo "::error::backend test suite took ${DURATION}s, exceeding its ${BUDGET}s runtime budget (test-runtime-budgets.json). See docs/test-runtime-budgets.md."
            exit 1
          fi

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **CI Test failed!** Please check the action logs for details.'
            })

  build:
    name: Build contract
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build contract
        working-directory: ./backend
        run: cargo build --target wasm32v1-none --release

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **CI Build failed!** Please check the action logs for details.'
            })

  lint:
    name: Lint code
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Run clippy
        working-directory: ./backend
        run: cargo clippy

      - name: Run rustfmt
        working-directory: ./backend
        run: cargo fmt --check

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **CI Lint failed!** Please check the action logs for details.'
            })

  # ===========================================================================
  # Test result reporting — combine JUnit XMLs into a GitHub Check
  # ===========================================================================
  report-test-results:
    name: Test results
    needs: [node-tests, core-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download JUnit reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Publish test results to Checks
        continue-on-error: true
        uses: dorny/test-reporter@0f7d1ed661203449e0ee89fa7a0a7f9c9a7d9911 # v2.7.0
        with:
          name: JUnit Test Results
          path: '**/test-results.xml'
          reporter: java-junit
          fail-on-error: 'false'
          list-suites: 'failed'
          list-tests: 'failed'
          max-annotations: 10

  # ===========================================================================
  # Discord failure notification — sends a webhook when any critical job fails
  # ===========================================================================
  notify-discord:
    name: Notify Discord on failure
    needs:
      - test
      - build
      - lint
      - node-tests
      - license-compliance
      - sdk-types-sync
      - core-install
      - core-format
      - core-lint
      - core-type-check
      - core-test
      - core-build
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret configured — skipping notification"
            exit 0
          fi

          # Collect which jobs failed
          FAILED_JOBS=""
          for job in test build lint node-tests license-compliance sdk-types-sync core-install core-format core-lint core-type-check core-test core-build; do
            result=$(echo '${{ toJSON(needs) }}' | jq -r --arg job "$job" '.[$job].result // "skipped"')
            if [ "$result" = "failure" ]; then
              FAILED_JOBS="$FAILED_JOBS\n- **$job**: ❌ $result"
            fi
          done

          curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "$(jq -n --arg msg "$COMMIT_MSG" --arg author "$COMMIT_AUTHOR" --arg sha "$COMMIT_SHA" --arg url "$RUN_URL" --arg ref "$REF_NAME" --arg repo "$REPO_NAME" --arg failed "$FAILED_JOBS" '{
              embeds: [{
                title: "❌ CI Failed: \($repo)",
                description: "Pipeline **\($ref)** failed on commit [`\($sha[0:7])`](\($url))",
                color: 15158332,
                fields: [
                  { name: "Commit", value: $msg, inline: false },
                  { name: "Author", value: $author, inline: true },
                  { name: "Run", value: "[View logs](" + $url + ")", inline: true },
                  { name: "Failed Jobs", value: ($failed | if . == "" then "none" else . end), inline: false }
                ],
                timestamp: (now | todate)
              }]
            })' \
            "$DISCORD_WEBHOOK" || echo "Discord webhook call failed (non-fatal)"

  syncpack:
    name: Dependency version consistency
    needs: [pnpm-cache, changes]
    if: >-
      needs.changes.outputs.shared_config == 'true' ||
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.notifications == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Check for version mismatches
        run: pnpm syncpack:check

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Dependency version mismatch detected!** Run `pnpm syncpack:check` locally and align versions before merging.'
            })

  sdk-fixture-mock-guard:
    name: SDK fixture mock audit guard
    needs: [pnpm-cache, changes]
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Fail on undocumented SDK integration mocks
        run: pnpm check:sdk-fixture-mocks

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Undocumented SDK fixture mock detected!** Run `pnpm check:sdk-fixture-mocks` locally, then either document the mock in the "Documented mocks (CI allowlist)" block of `docs/sdk-integration-fixture-audit.md` (with justification) or replace it with a live testnet-backed fixture.'
            })

  validate-packages:
    name: Validate package.json consistency
    needs: [pnpm-cache, changes]
    if: >-
      needs.changes.outputs.shared_config == 'true' ||
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.notifications == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Validate all workspace package.json files
        run: node scripts/validate-packages.mjs

      - name: Check SDK export map consistency (#1210)
        run: pnpm check:sdk-export-maps

      - name: Check SDK support windows (#1211)
        run: pnpm check:sdk-support-windows

      - name: Check React peer contract (#1213)
        run: pnpm check:react-peer-contract

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Package.json validation failed!** Run `node scripts/validate-packages.mjs` locally and fix violations before merging.'
            })

  sdk-rc-smoke:
    name: SDK RC pack smoke (#1212)
    needs: [pnpm-cache, changes]
    if: >-
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.shared_config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Build shared workspace dependency
        run: pnpm --filter @iln/shared build

      - name: Pack and resolve both SDK surfaces (#1212)
        run: pnpm check:sdk-rc-smoke --json=rc-smoke-report.json

      - name: Upload RC smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-rc-smoke-report
          path: rc-smoke-report.json
          if-no-files-found: warn

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **SDK RC smoke failed!** A packed SDK surface does not resolve. Run `pnpm check:sdk-rc-smoke` locally and inspect `rc-smoke-report.json` before merging.'
            })

  monorepo-map:
    name: Monorepo map drift check
    needs: [pnpm-cache, changes]
    if: >-
      needs.changes.outputs.shared_config == 'true' ||
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.notifications == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.indexer == 'true'
    runs-on: namespace-profile-nursca
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Check monorepo map against workspace members
        run: pnpm check-monorepo-map

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Monorepo map drift detected!** Update `docs/monorepo-map.md` or the workspace membership so the map stays authoritative.'
            })

  compatibility-matrix:
    name: Cross-repo version compatibility check
    needs: [pnpm-cache, changes]
    if: >-
      needs.changes.outputs.shared_config == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.indexer == 'true'
    runs-on: namespace-profile-nursca
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Verify current SDK/contract/frontend version matrix
        run: pnpm check-compatibility

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Cross-repo compatibility failed!** Update the matching matrix row in `docs/cross-repo-dependencies.md` before merging.'
            })
  gitleaks:
    name: Secret scanning
    needs: pnpm-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan repository for secrets
        run: gitleaks detect --no-git -s . --config gitleaks.toml --baseline-path .secrets.baseline

  no-foreign-lockfiles:
    name: Guard against non-pnpm lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for stray package-lock.json / yarn.lock files
        run: node scripts/check-no-foreign-lockfiles.mjs

      - name: Check for duplicate shared type definitions
        run: node scripts/check-no-duplicate-types.mjs

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Repository guardrail failed.** Check the job log for a foreign lockfile or a duplicate shared type definition. Use pnpm at the repository root and import shared types from `@iln/shared` where applicable.'
            })

  node-tests:
    name: Run Node.js tests
    needs: [pnpm-cache, changes]
    if: >-
      needs.changes.outputs.shared_config == 'true' ||
      needs.changes.outputs.notifications == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Run notification template tests
        run: pnpm exec vitest run tests/templates.test.ts
        working-directory: notifications

      - name: Generate JUnit reports (vitest packages)
        if: always()
        continue-on-error: true
        run: |
          for pkg in sdk cli indexer notifications packages/react packages/mock-backend packages/opentelemetry packages/upgrade-tests packages/test-utils; do
            if [ -f "$pkg/vitest.config.ts" ] || [ -f "$pkg/vitest.config.js" ]; then
              echo "Generating JUnit report for $pkg..."
              cd "$GITHUB_WORKSPACE/$pkg"
              pnpm vitest run --reporter=junit --outputFile=test-results.xml 2>/dev/null || true
            fi
          done

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: '**/test-results.xml'
          retention-days: 7

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **CI Node.js tests failed!** Please check the action logs for details.'
            })

  # Node.js coverage for the notifications package lives in coverage.yml
  # (Coverage / Node.js coverage (notifications)) — it ran an identical
  # `vitest run tests/templates.test.ts --coverage ...` command here too,
  # duplicating the same test run and Codecov upload on every push/PR.

  # packages/shared is a dependency of the SDK, CLI, indexer, and notifications
  # service, so a type-level regression there breaks type-checking for every
  # consumer without failing a runtime test. `pnpm test` in that package runs
  # tsc over src/ and then tsd over test-d/. This runs unconditionally rather
  # than path-filtered so it is always present as a required status check.
  shared-type-tests:
    name: Shared package type tests
    needs: pnpm-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Type-check and run tsd assertions
        run: pnpm --filter @iln/shared test

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **`@iln/shared` type tests failed!** A type in `packages/shared` changed in a way its `test-d/` assertions reject. Every consumer (`sdk`, `cli`, `indexer`, `notifications`) type-checks against these types — run `pnpm --filter @iln/shared test` locally before merging.'
            })

  license-compliance:
    name: Dependency license compliance check
    needs: [changes, pnpm-cache]
    if: >-
      needs.changes.outputs.shared_config == 'true' ||
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.notifications == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Run license compliance check
        run: |
          node scripts/check-licenses.js --json > license-report.json 2>&1 || true
        continue-on-error: true

      - name: Upload license compliance report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-report
          path: '**/license-report.json'
          retention-days: 30
          if-no-files-found: warn

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Dependency license compliance check failed!** Please verify your package dependencies conform to the license policy. Download the **license-compliance-report** artifact from the workflow run for details.'
            })

  sdk-types-sync:
    name: SDK types in sync
    needs: [pnpm-cache, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache Stellar CLI (cargo install)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-stellar-cli
          restore-keys: |
            ${{ runner.os }}-stellar-cli-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Configure testnet
        run: stellar network use testnet

      - name: Build contract (skip if submodule empty)
        working-directory: ./backend
        run: |
          if [ -f "Cargo.toml" ]; then
            stellar contract build
            stellar contract info --wasm target/wasm32v1-none/release/*.wasm --output-format json > target/spec.json
          else
            echo "Contract submodule not initialized, skipping"
          fi

      - name: Regenerate SDK types
        run: pnpm generate:types || echo "Skipped (no spec.json)"

      - name: Check if types changed
        run: |
          if ! git diff --exit-code sdk/src/generated/types.ts; then
            echo "❌ Generated types are out of sync!"
            echo "Run: pnpm generate:types"
            exit 1
          fi

      - name: Check SDK/deployed-ABI compatibility (issue #1094)
        run: |
          if [ -f backend/target/spec.json ]; then
            pnpm check:contract-abi-compat
          else
            echo "Contract submodule not initialized, skipping ABI compatibility check"
          fi

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **SDK types are out of sync!** Run `pnpm generate:types` and commit the changes.'
            })

  sdk-testnet-integration:
    name: SDK testnet integration tests
    needs: [pnpm-cache, testnet-health]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.testnet-health.outputs.healthy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Run SDK testnet integration tests
        working-directory: ./sdk
        run: pnpm test:integration:testnet
        env:
          FREELANCER_SECRET: ${{ secrets.TESTNET_FREELANCER_SECRET }}
          PAYER_SECRET: ${{ secrets.TESTNET_PAYER_SECRET }}
          FUNDER_SECRET: ${{ secrets.TESTNET_FUNDER_SECRET }}

  # ===========================================================================
  # Core JS/TS quality gate — Issue #252
  #
  # Models the dependency graph required by the issue:
  #   install ──► lint ──┐
  #           └► type-check ──► test ──► build
  # lint and type-check run in parallel after install; test waits for both;
  # build waits for test. Each job reuses the pnpm store cache and shares a
  # turbo cache so unchanged packages are not rebuilt.
  # ===========================================================================
  core-install:
    name: Core · install
    needs: pnpm-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

  core-format:
    name: Core · format
    needs: core-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
      - name: Check formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            pnpm format:check
            exit 0
          fi

          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
          mapfile -t files < <(
            git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" |
              grep -E '\.(cjs|css|graphql|html|js|json|jsx|md|mdx|mjs|scss|ts|tsx|yaml|yml)$' |
              grep -vE '^(\.github/|pnpm-lock\.yaml$)' || true
          )

          if (( ${#files[@]} == 0 )); then
            echo "No newly added files require Prettier validation."
            exit 0
          fi

          printf 'Checking %s newly added file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          pnpm exec prettier --check -- "${files[@]}"

  core-lint:
    name: Core · lint
    needs: core-install
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-lint-
      - name: Lint
        run: pnpm exec turbo run lint --cache-dir=.turbo

  core-type-check:
    name: Core · type-check
    needs: core-install
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-typecheck-
      - name: Type-check
        run: pnpm exec turbo run type-check --cache-dir=.turbo

  core-test:
    name: Core · test
    needs: [core-format, core-lint, core-type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-test-
      - name: Test
        run: pnpm exec turbo run test --cache-dir=.turbo --summarize

      - name: Root node --test suites
        run: |
          npm run test:checklist
          npm run test:audit
          npm run test:provenance
          npm run test:sdk-fixture-mocks
          npm run test:sdk-package-names
          npm run test:sdk-export-maps
          npm run test:sdk-support-windows
          npm run test:sdk-rc-smoke
          npm run test:react-peer-contract
          npm run test:contract-abi-compat
          npm run test:e2e-guards
          npm run test:release-scripts
          npm run test:canary
          npm run canary:drill

      - name: Root scripts/__tests__ (vitest)
        run: |
          START=$(date +%s.%N)
          pnpm exec vitest run scripts/__tests__ --exclude "**/*.test.mjs" --exclude "**/*.test.js" --exclude "**/check-compatibility.test.ts"
          END=$(date +%s.%N)
          echo "ROOT_SCRIPTS_TEST_DURATION_SECONDS=$(echo "$END - $START" | bc)" >> "$GITHUB_ENV"

      - name: Enforce test-runtime budgets
        run: |
          SUMMARY=$(ls -t .turbo/runs/*.json | head -1)
          node scripts/check-test-runtime-budgets.mjs --turbo-summary="$SUMMARY" --external "root-scripts=${ROOT_SCRIPTS_TEST_DURATION_SECONDS}"

  core-build:
    name: Core · build
    needs: core-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-build-
      - name: Build
        run: pnpm exec turbo run build --cache-dir=.turbo

  core-summary:
    name: Core · PR summary
    needs: [core-install, core-format, core-lint, core-type-check, core-test, core-build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post results summary to PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              install: '${{ needs.core-install.result }}',
              format: '${{ needs.core-format.result }}',
              lint: '${{ needs.core-lint.result }}',
              'type-check': '${{ needs.core-type-check.result }}',
              test: '${{ needs.core-test.result }}',
              build: '${{ needs.core-build.result }}',
            };
            const icon = (r) =>
              r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const rows = Object.entries(jobs)
              .map(([name, result]) => `| ${name} | ${icon(result)} ${result} |`)
              .join('\n');
            const body = [
              '### 🧪 Core CI summary',
              '',
              '| Stage | Result |',
              '| --- | --- |',
              rows,
            ].join('\n');

            const marker = '<!-- core-ci-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }
