name: Dead Code Check

# This is a required check that blocks merges if dead code is detected.
# Unused exports, files, and dependencies are reported via `knip`.
# Intentional exceptions should be documented in knip.json's ignore fields.
# See CONTRIBUTING.md for how to interpret and address the output locally.

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

# Least-privilege: read code to run the dead-code check.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-cache:
    uses: ./.github/workflows/reusable-cache-pnpm.yml

  knip:
    name: knip
    needs: pnpm-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Run knip
        run: pnpm dead-code:check
