name: E2E Integration

on:
  push:
    branches: [main, dev]
    paths:
      - 'tests/e2e/**'
      - 'sdk/**'
      - 'packages/**'
      - 'scripts/provision-e2e-contract.mjs'
      - 'scripts/check-e2e-coverage.mjs'
      - 'scripts/wait-for-stellar-rpc.mjs'
      - 'scripts/provision-e2e-node.mjs'
      - '.github/workflows/e2e.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'e2e-skip-budgets.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'tests/e2e/**'
      - 'sdk/**'
      - 'packages/**'
      - 'scripts/provision-e2e-contract.mjs'
      - 'scripts/check-e2e-coverage.mjs'
      - 'scripts/wait-for-stellar-rpc.mjs'
      - 'scripts/provision-e2e-node.mjs'
      - '.github/workflows/e2e.yml'
      - 'e2e-skip-budgets.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Provision local Stellar node for E2E and disaster recovery
        run: node scripts/provision-e2e-node.mjs

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      # ── #1241: provision a REAL deployed contract for the lifecycle suite ──────
      # No placeholder contract ID is ever used (#1242). The script either verifies
      # an already-deployed CONTRACT_ID against the live chain or deploys the
      # built WASM, and fails with the recovery path if neither is possible.
      - name: Install Rust and Stellar CLI
        run: |
          rustup target add wasm32v1-none
          cargo install --locked stellar-cli

      - name: Cache Cargo build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: ${{ runner.os }}-stellar-cli-e2e

      - name: Build contract WASM
        run: |
          if [ -f backend/Cargo.toml ]; then
            cargo build --manifest-path backend/Cargo.toml --target wasm32v1-none --release
          elif [ -f Cargo.toml ]; then
            cargo build --target wasm32v1-none --release
          else
            echo "No contract crate found; provisioning will rely on an existing CONTRACT_ID."
          fi

      - name: Provision E2E contract (real deployment, no placeholders)
        id: provision
        run: node scripts/provision-e2e-contract.mjs

      # ── #1243: the suite must actually run ─────────────────────────────────────
      # The E2E prerequisites are fail-closed (#1244): an unreachable node or a
      # missing contract ID fails the run instead of skipping it.
      - name: Run E2E Tests
        run: |
          mkdir -p .artifacts
          pnpm exec vitest run tests/e2e \
            --reporter=default --reporter=json \
            --outputFile.json=.artifacts/e2e-results.json \
            | tee .artifacts/e2e-output.txt
        env:
          # Re-provisioned here so the E2E suites never fall back to a placeholder.
          CONTRACT_ID: ${{ steps.provision.outputs.contract-id }}
          E2E_SKIP_REASONS_FILE: .artifacts/e2e-skip-reasons.jsonl
          # Deliberately NOT setting E2E_ALLOW_SKIP: the skip escape hatch is
          # forbidden on CI, and check-e2e-coverage.mjs fails the run if it is set.

      - name: Enforce E2E coverage gate (no skips, every suite executed, no placeholders)
        if: always()
        run: |
          node scripts/check-e2e-coverage.mjs \
            --report=.artifacts/e2e-results.json \
            --budgets=e2e-skip-budgets.json \
            --branch="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" \
            --skip-reasons=.artifacts/e2e-skip-reasons.jsonl \
            --evidence=.artifacts/e2e-control-evidence.json \
            --scan-sources

      - name: Upload E2E evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-evidence-${{ github.run_id }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
