name: SDK Support Windows

# Blocking guard for the SDK versioning and support-window policy (#1211).
#
# Fails when an SDK surface (sdk/, packages/sdk/, packages/react/) has no
# declared support window, when the declared version drifts from the surface's
# package.json, when a window is malformed or has silently closed, or when
# docs/sdk-versioning.md stops describing a surface. The JSON report is
# uploaded on every run (pass or fail) as proof the control ran — see
# docs/runbooks/sdk-support-windows.md.
#
# Dependency-free (plain Node), so it does not need a pnpm install.

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  schedule:
    # Monthly sweep — support windows expire with the calendar, so a periodic
    # run catches an eol date that has passed since the last PR.
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-support-windows:
    name: SDK support windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests for the guard
        run: node --test scripts/__tests__/check-sdk-support-windows.test.mjs

      - name: Enforce support-window policy
        run: node scripts/check-sdk-support-windows.mjs --json="$RUNNER_TEMP/sdk-support-windows-report.json"

      - name: Job summary
        if: always()
        run: |
          REPORT="$RUNNER_TEMP/sdk-support-windows-report.json"
          [ -f "$REPORT" ] || exit 0
          node -e '
            const r = require(process.argv[1]);
            const s = r.summary;
            const lines = [
              "### SDK support windows",
              "",
              `| Result | Findings | Surfaces | Today |`,
              `|---|---|---|---|`,
              `| ${s.ok ? "✅ pass" : "❌ fail"} | ${s.total} | ${(s.surfaces || []).join(", ")} | ${s.today} |`,
            ];
            console.log(lines.join("\n"));
          ' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-support-windows-report
          path: ${{ runner.temp }}/sdk-support-windows-report.json
          if-no-files-found: ignore
          retention-days: 30
